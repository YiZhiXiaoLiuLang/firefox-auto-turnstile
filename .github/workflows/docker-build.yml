name: docker-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_LC: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires all-lowercase image names.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${IMAGE_LC,,}" >> "$GITHUB_OUTPUT"

      # Smoke test on the native arch runner: full stack, test sitekey.
      - name: Smoke test (Turnstile relay, test sitekey)
        run: |
          set -eux
          image="relay-smoke:${{ matrix.arch }}"
          docker build -t "$image" .
          docker run -d --rm \
            --name relay-smoke \
            --shm-size 2g \
            -e DISPLAY_WIDTH=1280 -e DISPLAY_HEIGHT=800 \
            -p 127.0.0.1:18081:8081 \
            -v "$(pwd)/smoke-data:/config" \
            "$image"
          cleanup() { docker logs relay-smoke | tail -80 || true; docker rm -f relay-smoke || true; }
          trap cleanup EXIT

          # Wait for the API (up to ~2 min; Firefox + mitmproxy cold start).
          api_up=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18081/healthz > /dev/null; then api_up=1; break; fi
            sleep 2
          done
          if [ "$api_up" != "1" ]; then
            echo "API did not become healthy in 120s"
            exit 1
          fi

          # Cloudflare's official "always passes (invisible)" test sitekey.
          # The document is replaced by the addon, so example.com is never hit.
          # Expected token: XXXX.DUMMY.TOKEN.XXXX
          # Run in the background; while the task is in flight, simulate the
          # user's calibration click on the widget and assert the coordinates
          # are captured and returned with the token.
          curl -s -X POST http://127.0.0.1:18081/solve \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/login","sitekey":"1x00000000000000000000BB","timeout":180}' \
            > solve-resp.json &
          solve_pid=$!

          # Wait until the task is visible in /status (Firefox navigated).
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:18081/status | grep -q '"current"'; then
              if curl -s http://127.0.0.1:18081/status | python3 -c 'import sys,json; d=json.load(sys.stdin); exit(0 if d["current"] else 1)'; then break; fi
            fi
            sleep 1
          done
          sleep 2  # let the widget render

          # Simulate the user's click at a known position (inside the widget
          # area of the injected page). xdotool clicks via the XTEST device;
          # xinput reports it with root coordinates like a real click.
          # docker exec does not inherit the services' environment; derive
          # DISPLAY from the live X socket (e.g. /tmp/.X11-unix/X0 -> :0).
          disp=$(docker exec relay-smoke sh -c 'ls /tmp/.X11-unix/ 2>/dev/null | sed -n "s/^X/:/p" | head -1')
          echo "X display for exec: $disp"

          # Diagnostic matrix: find which listener style sees XTEST clicks.
          docker exec -e DISPLAY="$disp" relay-smoke sh -c '
            timeout 6 xinput test-xi2 --root > /tmp/probe-xi2root.txt 2>&1 &
            timeout 6 xinput test-xi2 VirtualCore/XTEST 2>/dev/null > /tmp/probe-xi2dev.txt 2>&1 &
            timeout 6 xinput test VirtualCore/XTEST 2>/dev/null > /tmp/probe-legacy.txt 2>&1 &
            sleep 1
            xdotool mousemove 640 300 click 1
            sleep 5
            echo "--- xi2 --root:"; cat /tmp/probe-xi2root.txt
            echo "--- xi2 device:"; cat /tmp/probe-xi2dev.txt
            echo "--- legacy test:"; cat /tmp/probe-legacy.txt
          ' || true
          docker exec -e DISPLAY="$disp" relay-smoke sh -c 'xinput list' || true
          docker exec -e DISPLAY="$disp" relay-smoke xdotool mousemove 640 300 click 1

          wait "$solve_pid"
          resp=$(cat solve-resp.json)
          echo "solve response: $resp"
          echo "$resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["ok"] is True and d["token"]=="XXXX.DUMMY.TOKEN.XXXX" and d["hostname"]=="example.com" and d.get("calibrated") is True and d["click"]["x"]==640 and d["click"]["y"]==300, d; print("smoke test passed: token + calibration click", d["click"], "in", d["elapsed"], "s")'
          # The calibration must also be persisted per-hostname.
          curl -s http://127.0.0.1:18081/coords | python3 -c 'import sys,json; d=json.load(sys.stdin); c=d["coords"]["example.com"]; assert c["x"]==640 and c["y"]==300, d; print("coords persisted:", c)'

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/digest-${{ matrix.arch }}${digest#sha256:}"
      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/digest-*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          name="ghcr.io/${{ github.repository }}"
          echo "name=${name,,}" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image="${{ steps.image.outputs.name }}"
          tags="${{ steps.tags.outputs.tags }}"
          echo "Tagging $image with: $tags"
          sources=""
          for f in digest-*; do
            d="${f#digest-}"          # strip 'digest-'
            d="${d#amd64}"; d="${d#arm64}"
            sources="$sources $image@sha256:$d"
          done
          echo "Merging:$sources"
          tag_args=""
          for t in $tags; do
            tag_args="$tag_args --tag $t"
          done
          docker buildx imagetools create $tag_args $sources

